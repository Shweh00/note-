dataset:
  id: "real-handwriting-min18-YYYYMMDD"
  version: 1
  owner: "dev"
  privacy_level: "redacted-local-only"
  created_at: "YYYY-MM-DD"
  image_dir: "Inbox/HandwritingImages/real-samples"
  expected_dir: ".handwriting-ocr/real-samples/expected"
  config_path: ".handwriting-ocr/config.yaml"
  notes: "Do not commit real images or expected text to the repository."

validation:
  minimum_sample_count: 18
  allowed_extensions: ["jpg", "jpeg", "png"]
  required_filename_pattern: "^\\d{4}-\\d{2}-\\d{2}_[0-9]{3}_(zh|en|mixed|num)_[a-z0-9-]+_[a-z0-9-]+\\.(jpg|jpeg|png)$"
  required_privacy_checked: true
  required_commands:
    - "handwriting-ocr validate-samples --vault \"$HW_SAMPLE_VAULT\""
    - "handwriting-ocr doctor --config \"$HW_SAMPLE_VAULT/.handwriting-ocr/config.yaml\""
    - "handwriting-ocr batch --config \"$HW_SAMPLE_VAULT/.handwriting-ocr/config.yaml\""
    - "handwriting-ocr status --config \"$HW_SAMPLE_VAULT/.handwriting-ocr/config.yaml\""
  reviewer: "api-tester"

