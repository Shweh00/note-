[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-ocr-obsidian"
version = "0.1.0"
description = "Local handwriting image OCR organizer for Obsidian Markdown notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
offline-paddle = ["paddleocr>=3,<4"]

[project.scripts]
handwriting-ocr = "handwriting_ocr.cli:main"
handwriting-obsidian = "handwriting_obsidian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=handwriting_obsidian --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/handwriting_obsidian/__main__.py"]
