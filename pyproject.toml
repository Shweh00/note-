[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-obsidian"
version = "0.1.0"
description = "Local handwriting image OCR organizer for Obsidian Markdown notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
handwriting-obsidian = "handwriting_obsidian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
