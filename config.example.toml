# Copy this file to config.toml and adjust the paths.

# Folder where new handwritten images arrive.
input_dir = "incoming"

# Folder inside your Obsidian vault where Markdown notes should be written.
output_dir = "vault/Handwriting Notes"

# Images are copied here by the legacy TOML compatibility loader.
processed_dir = "incoming/processed"
error_dir = "incoming/error"

# SQLite state file used for de-duplication.
state_path = ".handwriting-ocr/state.sqlite"

# Supported image extensions: .jpg, .jpeg, .png, .webp, .heic.

# Tags added to every generated note.
tags = ["handwriting", "ocr"]

# Poll interval for the watch command, in seconds.
watch_interval_seconds = 5

[dedupe]
strategy = "content_hash"
# skip records a duplicate and archives it.
# keep records the first duplicate for each source_path + source_hash and leaves
# the file in input_dir; later batch/watch scans do not add more duplicate rows.
on_duplicate = "skip"

[ocr]
# "mock" works without external services. It uses a same-name .txt sidecar file
# when present, otherwise it writes fallback_text.
provider = "mock"
fallback_text = "TODO: replace with OCR text"

# Optional local OCR provider. Requires tesseract to be installed separately:
# provider = "tesseract"
# command = "tesseract"
# languages = "eng+chi_sim"

# Optional PaddleOCR 3.x local provider. In no-network mode, use explicit model
# directories; at minimum configure detection and recognition.
# provider = "paddle"
# mode = "offline"
# offline_no_network = true
#
# [ocr.paddle]
# device = "cpu"
# lang = "ch"
# text_detection_model_dir = "/path/to/local/paddle/text_detection"
