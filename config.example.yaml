watch:
  input_dir: "Inbox/HandwritingImages"
  output_dir: "Inbox/HandwritingNotes"
  processed_dir: "Inbox/HandwritingImages/processed"
  error_dir: "Inbox/HandwritingImages/error"
  settle_seconds: 1
  recursive: false
  polling: true

ocr:
  mode: "mock"
  provider: "mock"
  model: "mock"
  language: "zh-cn,en"
  retry_count: 3
  timeout_seconds: 120
  api_key_env: "OPENAI_API_KEY"
  fallback_text: "TODO: replace with OCR text"
  command: "tesseract"
  # true means offline providers must use local models/data only.
  offline_no_network: true
  # Optional Chinese-first local provider. Install with:
  #   pip install -e ".[offline-paddle]"
  # and pre-download/cache models before running in no-network mode.
  paddle:
    engine: "paddle"
    device: "cpu"
    lang: "ch"
    # PaddleOCR 3.x explicit local model directories. In no-network mode,
    # text_detection_model_dir and text_recognition_model_dir are required.
    text_detection_model_dir: ""
    text_recognition_model_dir: ""
    doc_orientation_classify_model_dir: ""
    doc_unwarping_model_dir: ""
    textline_orientation_model_dir: ""
    allow_model_download: false
    use_doc_orientation_classify: false
    use_doc_unwarping: false
    use_textline_orientation: false
  # Optional low-dependency local provider. Requires the system tesseract
  # command and traineddata packages such as chi_sim and eng.
  tesseract:
    lang: "chi_sim+eng"
    psm: 6
    oem: 1
    tessdata_dir: ""

markdown:
  filename_template: "{{date}}-{{source_basename}}.md"
  include_frontmatter: true
  include_source_image: true
  include_raw_ocr: true
  default_tags: ["handwriting", "ocr", "to-review"]
  date_folder:
    enabled: false
    pattern: "YYYY/MM/DD"
    # date_source resolves note_date. note_date drives the date folder,
    # filename_template {{date}}, template {{date}}, and index grouping=date.
    # created_at remains the processing timestamp.
    date_source: "processed_at"
  template:
    mode: "default"
    file_path: ""
    missing_behavior: "fallback"

state:
  sqlite_path: ".handwriting-ocr/state.sqlite"
  log_path: ".handwriting-ocr/handwriting-ocr.log"

dedupe:
  strategy: "content_hash"
  # skip records a duplicate and archives it with archive.after_success.
  # keep records the first duplicate for each source_path + source_hash and
  # leaves the file in input_dir; later batch/watch scans do not add more
  # duplicate rows for the same retained file.
  on_duplicate: "skip"

archive:
  after_success: "move"
  after_error: "move"

index:
  enabled: false
  path: "Index.md"
  title: "手写识别索引"
  grouping: "date"
  sort: "desc"
  include_status: true
  include_source_link: true
  update_mode: "managed_block"
